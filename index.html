    }
    .animate-pop {
      animation: pop-in 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;

      border-radius: 9999px;
    }
  </style>

    let masterBus = null;

    function initAudioEngine() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      if (!masterBus) {
        const now = audioCtx.currentTime;
        const sampleRate = audioCtx.sampleRate;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-14, now);
        compressor.knee.setValueAtTime(14, now);
        compressor.ratio.setValueAtTime(5, now);
        compressor.attack.setValueAtTime(0.002, now);
        compressor.release.setValueAtTime(0.16, now);

        masterGainNode = audioCtx.createGain();
        const vol = volumeSlider ? parseInt(volumeSlider.value, 10) / 100 : 0.85;
        masterGainNode.gain.setValueAtTime(vol, now);

        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 64;
        analyserNode.smoothingTimeConstant = 0.78;

        const revLen = Math.floor(sampleRate * 1.45);
        const impulse = audioCtx.createBuffer(2, revLen, sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const data = impulse.getChannelData(ch);
          for (let i = 0; i < revLen; i++) {
            const env = Math.pow(1 - i / revLen, 2.8);
            const early = i < sampleRate * 0.045 ? Math.sin(i * 0.08) * 0.35 : 1;
            data[i] = (Math.random() * 2 - 1) * env * early;
          }
        }
        const reverb = audioCtx.createConvolver();
        reverb.buffer = impulse;
        const reverbWet = audioCtx.createGain();
        reverbWet.gain.setValueAtTime(0.26, now);

        const delayL = audioCtx.createDelay(1.0);
        const delayR = audioCtx.createDelay(1.0);
        delayL.delayTime.setValueAtTime(0.165, now);
        delayR.delayTime.setValueAtTime(0.22, now);
        const fbL = audioCtx.createGain();
        const fbR = audioCtx.createGain();
        fbL.gain.setValueAtTime(0.22, now);
        fbR.gain.setValueAtTime(0.22, now);
        const delayFilter = audioCtx.createBiquadFilter();
        delayFilter.type = "lowpass";
        delayFilter.frequency.setValueAtTime(2800, now);
        const delayWet = audioCtx.createGain();
        delayWet.gain.setValueAtTime(0.16, now);

        const merger = audioCtx.createChannelMerger(2);
        delayL.connect(fbL);
        fbL.connect(delayR);
        delayR.connect(fbR);
        fbR.connect(delayL);
        delayL.connect(merger, 0, 0);
        delayR.connect(merger, 0, 1);
        merger.connect(delayFilter);
        delayFilter.connect(delayWet);

        masterBus = audioCtx.createGain();
        masterBus.connect(compressor);
        masterBus.connect(reverb);
        reverb.connect(reverbWet);
        reverbWet.connect(compressor);
        masterBus.connect(delayL);
        delayWet.connect(compressor);

        compressor.connect(masterGainNode);
        masterGainNode.connect(analyserNode);
        analyserNode.connect(audioCtx.destination);

        const nLen = Math.floor(sampleRate * 0.12);
        noiseBuffer = audioCtx.createBuffer(1, nLen, sampleRate);
        const nData = noiseBuffer.getChannelData(0);
        for (let i = 0; i < nLen; i++) {
          nData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sampleRate * 0.015));
        }

        startVisualizer();
      }
    }

    function startVisualizer() {
      if (!vizCanvas || !vizCtx || vizAnimId) return;
      const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
      function drawViz() {
        vizAnimId = requestAnimationFrame(drawViz);
        if (!analyserNode) return;
        analyserNode.getByteFrequencyData(dataArray);
        vizCanvas.width = vizCanvas.offsetWidth;
        vizCanvas.height = vizCanvas.offsetHeight;
        vizCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);

        const bars = 20;
        const step = Math.floor(dataArray.length / bars);
        const barWidth = (vizCanvas.width / bars) * 0.65;
        const gap = (vizCanvas.width / bars) * 0.35;

        for (let i = 0; i < bars; i++) {
          const val = dataArray[i * step] / 255;
          if (val <= 0.02) continue;
          const h = Math.max(3, val * vizCanvas.height * 0.9);
          const x = i * (barWidth + gap) + gap / 2;
          const y = vizCanvas.height - h;
          vizCtx.fillStyle = `rgba(99, 102, 241, ${0.25 + val * 0.65})`;
          vizCtx.beginPath();
          vizCtx.roundRect(x, y, barWidth, h, 3);
          vizCtx.fill();
        }
      }
      drawViz();
    }

    function playFMVoice({
      freq,
      carrierType = "sine",
      modRatio = 2.0,
      modIndex = 0,
      modDecay = 0.08,
      attack = 0.003,
      decay = 0.15,
      gain = 0.12,
      detune = 0,
      pan = 0,
      filterFreq = 0,
      delay = 0,
      pitchEnd = 0
    }) {
      if (!soundToggle.checked) return;
      try {
        initAudioEngine();
        const t0 = audioCtx.currentTime + delay;

        const carrier = audioCtx.createOscillator();
        const vGain = audioCtx.createGain();
        carrier.type = carrierType;
        carrier.frequency.setValueAtTime(freq, t0);
        if (pitchEnd > 0) {
          carrier.frequency.exponentialRampToValueAtTime(pitchEnd, t0 + decay);
        }
        if (detune !== 0) {
          carrier.detune.setValueAtTime(detune, t0);
        }

        if (modIndex > 0) {
          const mod = audioCtx.createOscillator();
          const modGain = audioCtx.createGain();
          mod.type = "sine";
          mod.frequency.setValueAtTime(freq * modRatio, t0);
          modGain.gain.setValueAtTime(freq * modIndex, t0);
          modGain.gain.exponentialRampToValueAtTime(0.01, t0 + Math.max(0.02, modDecay));
          mod.connect(modGain);
          modGain.connect(carrier.frequency);
          mod.start(t0);
          mod.stop(t0 + attack + decay + 0.03);
        }

        vGain.gain.setValueAtTime(0.0001, t0);
        vGain.gain.linearRampToValueAtTime(gain, t0 + attack);
        vGain.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);

        let lastNode = carrier;
        if (filterFreq > 0) {
          const filter = audioCtx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(filterFreq, t0);
          filter.Q.setValueAtTime(2.2, t0);
          lastNode.connect(filter);
          lastNode = filter;
        }

        lastNode.connect(vGain);

        if (audioCtx.createStereoPanner && pan !== 0) {
          const panner = audioCtx.createStereoPanner();
          panner.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), t0);
          vGain.connect(panner);
          panner.connect(masterBus);
        } else {
          vGain.connect(masterBus);
        }

        carrier.start(t0);
        carrier.stop(t0 + attack + decay + 0.03);
      } catch (e) {}
    }

    function playNoiseBurst({ filterFreq = 1800, q = 3.5, gain = 0.08, decay = 0.03, pan = 0, delay = 0 }) {
      if (!soundToggle.checked) return;
      try {
        initAudioEngine();
        const t0 = audioCtx.currentTime + delay;
        const src = audioCtx.createBufferSource();
        src.buffer = noiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(filterFreq, t0);
        filter.Q.setValueAtTime(q, t0);

        const nGain = audioCtx.createGain();
        nGain.gain.setValueAtTime(gain, t0);
        nGain.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);

        src.connect(filter);
        filter.connect(nGain);

        if (audioCtx.createStereoPanner && pan !== 0) {
          const panner = audioCtx.createStereoPanner();
          panner.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), t0);
          nGain.connect(panner);
          panner.connect(masterBus);
        } else {
          nGain.connect(masterBus);
        }

        src.start(t0);
        src.stop(t0 + decay + 0.01);
      } catch (e) {}
    }

    function playReelStep(step, totalSteps) {
      if (!soundToggle.checked) return;
      const preset = soundPreset ? soundPreset.value : "celesta";
      const progress = step / totalSteps;
      const pan = Math.sin(step * 0.85) * 0.55;

          modIndex: 2.2 - progress * 1.0,

        if (totalSteps - step <= 4) {
          playFMVoice({ freq: 98.0, pitchEnd: 65.41, carrierType: "sine", modRatio: 1.5, modIndex: 1.5, modDecay: 0.08, attack: 0.004, decay: 0.18, gain: 0.15 });
        }
      } else if (preset === "marimba") {
        playFMVoice({
          freq: baseNote,
          carrierType: "sine",
          modRatio: 4.0,
          modIndex: 1.6,
          modDecay: 0.025,
          attack: 0.002,
          decay: 0.11 + progress * 0.06,
          gain: 0.15,
          pan
        });
        playFMVoice({ freq: baseNote * 9.2, carrierType: "sine", attack: 0.001, decay: 0.015, gain: 0.025, pan });
        playNoiseBurst({ filterFreq: 1500 + step * 35, q: 4.5, gain: 0.05, decay: 0.018, pan });
      } else if (preset === "casino") {
        const pegFreq = 310 + (step % 4) * 22 + progress * 85;
        playNoiseBurst({ filterFreq: 2600 - progress * 600, q: 3.0, gain: 0.15, decay: 0.022, pan });
        playFMVoice({
          freq: pegFreq,
          pitchEnd: pegFreq * 0.48,
          carrierType: "triangle",
          modRatio: 2.5,
          modIndex: 1.8,
          modDecay: 0.02,
          attack: 0.001,
          decay: 0.042,
          gain: 0.14,
          pan
        });
      } else if (preset === "cyber") {
        const arpFreq = 196 * Math.pow(2, step / 13);
        playFMVoice({ freq: arpFreq, carrierType: "sawtooth", modRatio: 2.0, modIndex: 1.2, modDecay: 0.04, attack: 0.002, decay: 0.075, gain: 0.07, detune: -8, filterFreq: 2800, pan });
        playFMVoice({ freq: arpFreq, carrierType: "sawtooth", modRatio: 2.0, modIndex: 1.2, modDecay: 0.04, attack: 0.002, decay: 0.075, gain: 0.07, detune: 8, filterFreq: 2800, pan: -pan });
        playFMVoice({ freq: arpFreq * 0.5, carrierType: "square", attack: 0.002, decay: 0.05, gain: 0.05, filterFreq: 900 });
      } else if (preset === "zen") {
        playFMVoice({
          freq: baseNote * 1.25,
          carrierType: "sine",
          modRatio: 2.756,
          modIndex: 1.1,
          modDecay: 0.14,
          attack: 0.006,
          decay: 0.24,
          gain: 0.11,
          pan
        });
      }
    }

    function playWinChime() {
      if (!soundToggle.checked) return;
      const preset = soundPreset ? soundPreset.value : "celesta";

      if (preset === "celesta") {
        playFMVoice({ freq: 130.81, carrierType: "sine", modRatio: 1.0, modIndex: 1.2, modDecay: 0.5, attack: 0.01, decay: 1.1, gain: 0.16 });
        const notes = [523.25, 659.25, 783.99, 987.77, 1174.66, 1479.98, 1567.98];
        notes.forEach((n, i) => {
          const pan = (i / (notes.length - 1) - 0.5) * 0.85;
          playFMVoice({
            freq: n,
            carrierType: "sine",
            modRatio: 14.0,
            modIndex: 2.0,
            modDecay: 0.05,
            attack: 0.003,
            decay: 0.75,
            gain: 0.11,
            pan,
            delay: i * 0.052
          });
          playFMVoice({
            freq: n * 0.5,
            carrierType: "triangle",
            modRatio: 2.0,
            modIndex: 0.9,
            modDecay: 0.25,
            attack: 0.008,
            decay: 0.65,
            gain: 0.06,
            pan: -pan,
            delay: i * 0.052
          });
        });
      } else if (preset === "orchestra") {
        playFMVoice({ freq: 130.81, pitchEnd: 130.0, carrierType: "sine", modRatio: 1.5, modIndex: 2.0, modDecay: 0.2, attack: 0.005, decay: 0.9, gain: 0.18 });
        playNoiseBurst({ filterFreq: 3500, q: 1.8, gain: 0.09, decay: 0.08 });
        const fanfare = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        fanfare.forEach((n, i) => {
          const d = i * 0.048;
          const pan = (i % 2 === 0 ? -1 : 1) * 0.45;
          playFMVoice({ freq: n, carrierType: "sawtooth", modRatio: 1.0, modIndex: 1.5, modDecay: 0.3, attack: 0.015, decay: 0.85, gain: 0.075, filterFreq: 2800, detune: -7, pan, delay: d });
          playFMVoice({ freq: n, carrierType: "sawtooth", modRatio: 1.0, modIndex: 1.5, modDecay: 0.3, attack: 0.015, decay: 0.85, gain: 0.075, filterFreq: 2800, detune: 7, pan: -pan, delay: d });
        });
      } else if (preset === "marimba") {
        playFMVoice({ freq: 130.81, carrierType: "sine", modRatio: 4.0, modIndex: 1.2, modDecay: 0.08, attack: 0.004, decay: 0.85, gain: 0.16 });
        const run = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51, 1567.98];
        run.forEach((n, i) => {
          const pan = (i / (run.length - 1) - 0.5) * 0.8;
          playFMVoice({ freq: n, carrierType: "sine", modRatio: 4.0, modIndex: 1.8, modDecay: 0.03, attack: 0.002, decay: 0.55, gain: 0.13, pan, delay: i * 0.05 });
          playNoiseBurst({ filterFreq: 1800 + i * 200, q: 4.0, gain: 0.04, decay: 0.02, pan, delay: i * 0.05 });
        });
      } else if (preset === "casino") {
        const bells = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        bells.forEach((n, i) => {
          const d = i * 0.06;
          playFMVoice({ freq: n * 2, carrierType: "sine", modRatio: 3.14, modIndex: 2.5, modDecay: 0.06, attack: 0.001, decay: 0.35, gain: 0.09, pan: Math.sin(i * 2) * 0.6, delay: d });
          playFMVoice({ freq: n, carrierType: "sawtooth", attack: 0.005, decay: 0.45, gain: 0.07, filterFreq: 2600, delay: d });
        });
      } else if (preset === "cyber") {
        playFMVoice({ freq: 130.81, pitchEnd: 65.41, carrierType: "sawtooth", filterFreq: 600, attack: 0.005, decay: 0.7, gain: 0.16 });
        const arp = [261.63, 392.00, 523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        arp.forEach((n, i) => {
          playFMVoice({ freq: n, carrierType: "sawtooth", modRatio: 2.0, modIndex: 1.5, modDecay: 0.06, attack: 0.002, decay: 0.22, gain: 0.075, filterFreq: 3400, pan: Math.cos(i) * 0.6, delay: i * 0.04 });
        });
        [261.63, 329.63, 392.00, 493.88, 587.33].forEach((n, i) => {
          playFMVoice({ freq: n * 2, carrierType: "sawtooth", attack: 0.015, decay: 0.85, gain: 0.055, detune: (i - 2) * 9, filterFreq: 2600, delay: 0.28 });
        });
      } else if (preset === "zen") {
        const bowls = [261.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        bowls.forEach((n, i) => {
          const pan = (i % 2 === 0 ? -1 : 1) * 0.45;
          playFMVoice({ freq: n, carrierType: "sine", modRatio: 2.756, modIndex: 1.2, modDecay: 0.35, attack: 0.02, decay: 1.4, gain: 0.1, pan, delay: i * 0.075 });
          playFMVoice({ freq: n * 1.004, carrierType: "sine", attack: 0.03, decay: 1.3, gain: 0.06, pan: -pan, delay: i * 0.075 });
        });
      }
    }

    function updateFilterCounts() {
      bookBtns.forEach(btn => {
        const b = btn.dataset.book;
        const count = EXERCISES.filter(e => (b === "all" || e.book === b) && (activeApp === "all" || e.app === activeApp)).length;
        const label = b === "all" ? "All 4 Books" : b;
        btn.textContent = `${label} (${count})`;
      });
      appBtns.forEach(btn => {
        const a = btn.dataset.app;
        const count = EXERCISES.filter(e => (activeBook === "all" || e.book === activeBook) && (a === "all" || e.app === a)).length;
        const label = a === "all" ? "All Apparatus" : a;
        btn.textContent = `${label} (${count})`;
      });
    }

    function matchesFilters(ex) {
      const bookOk = activeBook === "all" || ex.book === activeBook;
      const appOk = activeApp === "all" || ex.app === activeApp;
      return bookOk && appOk;
    }

    function getFilteredPool() {
      return EXERCISES.filter(ex => {
        if (!matchesFilters(ex)) return false;
        if (noRepeatToggle.checked && drawnIds.has(ex.id)) return false;
        return true;
      });
    }

    function getTotalMatchingFilter() {
      return EXERCISES.filter(matchesFilters);
    }

    function updatePoolStatus() {
      updateFilterCounts();
      const available = getFilteredPool();
      const total = getTotalMatchingFilter();
      if (noRepeatToggle.checked) {
        poolCounter.textContent = `${available.length} of ${total.length} exercises remaining`;
        resetBtn.classList.toggle("hidden", drawnIds.size === 0);
      } else {
        poolCounter.textContent = `${total.length} exercises in pool`;
        resetBtn.classList.add("hidden");
      }

      if (total.length === 0) {
        drawBtnText.textContent = "No Matching Exercises";
        drawBtn.disabled = true;
      } else if (available.length === 0) {
        drawBtnText.textContent = "Pool Empty – Reset & Draw";
        drawBtn.disabled = false;
      } else if (!isSpinning) {
        drawBtnText.textContent = "Draw Exercise";
        drawBtn.disabled = false;
      }
    }

    function renderBadges(ex, isPlaceholder = false) {
      if (isPlaceholder) {
        exerciseBadges.innerHTML = `<span class="px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-400 text-xs">${ex.app} · ${ex.book}</span>`;
        return;
      }
      const items = [
        `<span class="px-2.5 py-0.5 rounded-md bg-indigo-600/90 text-white font-medium text-xs">${ex.app}</span>`,
        `<span class="px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-200 font-medium text-xs">${ex.book}</span>`,
        `<span class="px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-200 font-medium text-xs">${ex.level}</span>`,
        `<span class="px-2.5 py-0.5 rounded-md border border-slate-700 text-slate-300 text-xs">${ex.block}</span>`
      ];
      if (ex.series) {
        items.push(`<span class="px-2.5 py-0.5 rounded-md border border-slate-700 text-slate-300 text-xs">${ex.series}</span>`);
      }
      items.push(`<span class="px-2.5 py-0.5 rounded-md text-slate-400 text-xs">p. ${ex.p}</span>`);
      exerciseBadges.innerHTML = items.join("");
    }

    function renderHistory() {
      if (historyList.length === 0) {
        historyContainer.classList.add("hidden");
        return;
      }
      historyContainer.classList.remove("hidden");
      historyLabel.textContent = `Drawn History (${historyList.length})`;
      historyListEl.innerHTML = historyList
        .map((ex, idx) => `
          <span class="shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs border border-slate-800 bg-slate-950 text-slate-200">
            <span class="text-slate-500 font-mono">#${historyList.length - idx}</span>
            <span class="font-medium">${ex.name}</span>
            <span class="text-slate-400">(${ex.app})</span>
          </span>
        `)
        .join("");
    }

    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let animFrame = null;

    function fireConfetti() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const colors = ["#6366f1", "#10b981", "#f59e0b", "#ec4899", "#3b82f6", "#8b5cf6"];
      for (let i = 0; i < 45; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 11,
          vy: (Math.random() - 0.75) * 10 - 2,
          size: Math.random() * 5 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12,
          alpha: 1
        });
      }
      if (!animFrame) animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.28;
        p.rot += p.vRot;
        p.alpha -= 0.016;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        ctx.restore();
      });
      particles = particles.filter(p => p.alpha > 0 && p.y < canvas.height + 20);
      if (particles.length > 0) {
        animFrame = requestAnimationFrame(animateConfetti);
      } else {
        animFrame = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function triggerDraw() {
      if (isSpinning) return;
      const totalMatching = getTotalMatchingFilter();
      if (totalMatching.length === 0) return;

      let pool = getFilteredPool();
      if (pool.length === 0) {
        totalMatching.forEach(ex => drawnIds.delete(ex.id));
        pool = getFilteredPool();
        updatePoolStatus();
      }
      if (pool.length === 0) return;

      isSpinning = true;
      playUIClick("start");
      drawBtn.disabled = true;
      drawBtn.classList.add("opacity-80");
      drawBtnIcon.classList.add("animate-spin");
      drawBtnText.textContent = "Drawing...";
      exerciseTitle.classList.remove("animate-pop");

      const randBuf = new Uint32Array(1);
      window.crypto.getRandomValues(randBuf);
      const winner = pool[randBuf[0] % pool.length];

      const totalSteps = 26;
      let step = 0;

      function nextStep() {
        step++;
        if (step < totalSteps) {
          const r1 = totalMatching[Math.floor(Math.random() * totalMatching.length)];
          const r2 = totalMatching[Math.floor(Math.random() * totalMatching.length)];
          const r3 = totalMatching[Math.floor(Math.random() * totalMatching.length)];

          prevPreview.textContent = `${r1.name} (${r1.app})`;
          exerciseTitle.textContent = r2.name;
          nextPreview.textContent = `${r3.name} (${r3.app})`;
          renderBadges(r2, true);

          playReelStep(step, totalSteps);
          const progress = step / totalSteps;
          const delay = 32 + Math.pow(progress, 2.7) * 240;
          setTimeout(nextStep, delay);
        } else {
          const idx = totalMatching.indexOf(winner);
          const neighbor1 = totalMatching[(idx - 1 + totalMatching.length) % totalMatching.length];
          const neighbor2 = totalMatching[(idx + 1) % totalMatching.length];

          prevPreview.textContent = neighbor1 ? `${neighbor1.name} (${neighbor1.app})` : "";
          nextPreview.textContent = neighbor2 ? `${neighbor2.name} (${neighbor2.app})` : "";

          exerciseTitle.textContent = winner.name;
          void exerciseTitle.offsetWidth;
          exerciseTitle.classList.add("animate-pop");
          renderBadges(winner, false);

          if (noRepeatToggle.checked) {
            drawnIds.add(winner.id);
          }
          historyList.unshift(winner);
          renderHistory();
          updatePoolStatus();

          playWinChime();
          fireConfetti();

          isSpinning = false;
          drawBtn.disabled = false;
          drawBtn.classList.remove("opacity-80");
          drawBtnIcon.classList.remove("animate-spin");
        }
      }

      nextStep();
    }

    drawBtn.addEventListener("click", triggerDraw);

    bookBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        if (isSpinning) return;
        playUIClick("filter");
        activeBook = btn.dataset.book;
        bookBtns.forEach(b => {
          const active = b === btn;
          b.className = active
            ? "book-btn px-3 py-1 rounded-full text-xs font-medium transition-all bg-indigo-600 text-white cursor-pointer"
            : "book-btn px-3 py-1 rounded-full text-xs font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer";
        });
        updatePoolStatus();
      });
    });

    appBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        if (isSpinning) return;
        playUIClick("filter");
        activeApp = btn.dataset.app;
        appBtns.forEach(b => {
          const active = b === btn;
          b.className = active
            ? "app-btn shrink-0 px-2.5 py-1 rounded-md text-xs font-medium transition-all border border-indigo-500 bg-slate-800 text-white cursor-pointer"
            : "app-btn shrink-0 px-2.5 py-1 rounded-md text-xs font-medium transition-all border border-transparent bg-slate-950 text-slate-400 hover:text-slate-200 cursor-pointer";
        });
        updatePoolStatus();
      });
    });

    soundPreset.addEventListener("change", () => {
      playWinChime();
    });

    if (testSoundBtn) {
      testSoundBtn.addEventListener("click", () => {
        playWinChime();
      });
    }

    if (volumeSlider) {
      volumeSlider.addEventListener("input", () => {
        const v = parseInt(volumeSlider.value, 10) / 100;
        if (masterGainNode && audioCtx) {
          masterGainNode.gain.setValueAtTime(v, audioCtx.currentTime);
        }
        if (speakerIcon) {
          speakerIcon.textContent = v === 0 || !soundToggle.checked ? "🔇" : v < 0.45 ? "🔉" : "🔊";
        }
      });
    }

    soundToggle.addEventListener("change", () => {
      if (speakerIcon) {
        const v = volumeSlider ? parseInt(volumeSlider.value, 10) / 100 : 0.85;
        speakerIcon.textContent = !soundToggle.checked || v === 0 ? "🔇" : v < 0.45 ? "🔉" : "🔊";
      }
    });

    noRepeatToggle.addEventListener("change", updatePoolStatus);

    resetBtn.addEventListener("click", () => {
      drawnIds.clear();
      updatePoolStatus();
    });

    clearHistoryBtn.addEventListener("click", () => {
      historyList = [];
      drawnIds.clear();
      renderHistory();
      updatePoolStatus();
    });

    updatePoolStatus();
  </script>
</body>
